<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGP COLLEGE OF ENGINEERING AND TECHNOLOGY AN AUTONOMOUS INSTITUTION</title>
    
    <!-- React, ReactDOM & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Excel Export Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Babel is required for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            /* Background image loading with fallback color */
            background-image: url("background 2.PNG");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        /* Running Title Marquee Styling */
        .marquee-container {
            width: 100%;
            padding: 12px 0;
            overflow: hidden;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .marquee-text {
            display: inline-block;
            color: #000709;
            font-weight: bold;
            font-size: 1.25em;
            padding-left: 100%;
            letter-spacing: 1px;
            animation: marquee-animation 18s linear infinite;
        }
        @keyframes marquee-animation {
            0%   { transform: translateX(0%); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <!-- Running Title -->
    <div class="marquee-container">
        <div class="marquee-text">PGP COLLEGE OF ENGINEERING AND TECHNOLOGY - AN AUTONOMOUS INSTITUTION Approved by AICTE - New Delhi,Affiliated to anna university - Chennai</div>
    </div> <!-- ✨ Missing closing tag fixed here ✨ -->

    <!-- React App Container -->
    <div id="root"></div>

    <!-- React Script -->
    <!-- ✨ Changed type="module" to type="text/babel" ✨ -->
    <script type="text/babel" src="app.jsx"></script>
</body>
</html>
